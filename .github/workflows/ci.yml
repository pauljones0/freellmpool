name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Cold quickstart
        run: FREELLMPOOL_QUICKSTART_PACKAGE=. scripts/quickstart-test.sh

  mcp-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate with checksum-pinned mcp-publisher 1.7.9
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" mcp-publisher
          export PATH="$RUNNER_TEMP:$PATH"
          mcp-publisher validate server.json

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Validate reviewed policy channel and revision
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$POLICY_BASE" && test "$POLICY_BASE" != 0000000000000000000000000000000000000000; then
            python scripts/check_policy_channel.py --base "$POLICY_BASE"
          else
            python scripts/check_policy_channel.py
          fi
      - name: Check public count claims
        run: scripts/check-counts
      - name: Release metadata readiness
        run: python scripts/check_release_ready.py --skip-build
      - name: Proxy stress smoke
        run: python scripts/stress_proxy.py --profile ci
      - name: Type check focused helpers
        run: mypy --follow-imports=skip src/freellmpool/routing_modes.py src/freellmpool/catalog_validation.py src/freellmpool/_version.py src/freellmpool/readiness.py
      - name: Strict type check maintained gateway modules
        run: >-
          mypy --strict --follow-imports=silent
          src/freellmpool/managed.py src/freellmpool/managed_cli.py
          src/freellmpool/allowances.py src/freellmpool/provider_registry.py
          src/freellmpool/free_policy.py src/freellmpool/discovery.py
          src/freellmpool/onboarding.py src/freellmpool/client_setup.py
          src/freellmpool/request_security.py
          src/freellmpool/policy_updates.py src/freellmpool/account_observations.py
          src/freellmpool/limit_sources.py src/freellmpool/maintenance.py
          src/freellmpool/maintenance_cli.py
          src/freellmpool/workflow_health.py
      - name: Import smoke
        run: python -c "import freellmpool; from freellmpool import Pool, AsyncPool; print(freellmpool.__version__, Pool, AsyncPool)"
      - name: Test
        run: |
          pytest --cov=freellmpool --cov-branch --cov-report=term-missing --cov-report=json:.coverage.json -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning -W error::pytest.PytestUnhandledThreadExceptionWarning
          python scripts/check_coverage.py .coverage.json
      - name: Wheel smoke
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python -m venv /tmp/freellmpool-wheel-smoke
          /tmp/freellmpool-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/freellmpool-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/freellmpool-wheel-smoke/bin/python -c "import freellmpool; from freellmpool import Pool, AsyncPool; print(freellmpool.__version__, Pool, AsyncPool)"
          /tmp/freellmpool-wheel-smoke/bin/freellmpool --version
          FREELLMPOOL_CONFIG_FILE=/tmp/flp-smoke-config.toml \
          FREELLMPOOL_QUOTA_PATH=/tmp/flp-smoke-quota.json \
          FREELLMPOOL_CACHE_PATH=/tmp/flp-smoke-cache.db \
          FREELLMPOOL_EXTERNAL_CATALOG_PATH=/tmp/flp-smoke-external.json \
            /tmp/freellmpool-wheel-smoke/bin/freellmpool doctor

  llm-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned plugin test and build tooling
        run: >-
          python -m pip install --disable-pip-version-check
          build==1.5.0 pytest==9.0.2 twine==7.0.0
      - name: Test plugin registration and execution contracts
        run: PYTHONPATH=src pytest -q plugins/llm-freellmpool/tests
      - name: Build and validate plugin distributions
        run: |
          python -m build --outdir plugins/llm-freellmpool/dist plugins/llm-freellmpool
          python -m twine check plugins/llm-freellmpool/dist/*.whl plugins/llm-freellmpool/dist/*.tar.gz
      - name: Fresh-install the wheel and run a blocked-network llm smoke
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/llm-plugin-smoke"
          smoke_python="$RUNNER_TEMP/llm-plugin-smoke/bin/python"
          "$smoke_python" -m pip install --disable-pip-version-check --upgrade pip
          "$smoke_python" -m pip install --disable-pip-version-check "llm==0.33" -e .
          "$smoke_python" -m pip install --disable-pip-version-check \
            --no-deps plugins/llm-freellmpool/dist/*.whl
          "$smoke_python" -c \
            'import importlib.metadata as m; assert m.version("llm-freellmpool") == "0.1.2"'
          "$smoke_python" plugins/llm-freellmpool/tests/smoke_cli.py \
            "$RUNNER_TEMP/llm-plugin-smoke/bin/llm"

  opencode-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Use trusted-publishing-capable npm
        run: npm install --global npm@11.5.1
      - name: Pack, install, and load both integrations
        run: node scripts/check_opencode_packages.mjs

  docker-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and smoke-test the container
        run: |
          set -euo pipefail
          image="freellmpool:ci-${{ github.sha }}"
          container="freellmpool-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          readiness_body=$(mktemp)

          cleanup() {
            exit_code=$?
            set +e
            if test "$exit_code" -ne 0; then
              docker logs "$container"
            fi
            docker rm --force "$container" >/dev/null 2>&1
            docker image rm "$image" >/dev/null 2>&1
            rm --force "$readiness_body"
            exit "$exit_code"
          }
          trap cleanup EXIT

          docker build --tag "$image" .
          docker run --rm --entrypoint python "$image" -c \
            'import os, sys, freellmpool; assert sys.version_info[:2] == (3, 14); assert freellmpool.__version__; assert os.getuid() != 0'
          docker run --rm "$image" --version
          docker run --detach --name "$container" --publish 127.0.0.1:18080:8080 \
            --env FREELLMPOOL_PROXY_KEY=ci-local-smoke-key "$image" \
            proxy --host 0.0.0.0 --port 8080 --allow-lan --allowed-authority 127.0.0.1:18080

          healthy=false
          for _attempt in $(seq 1 30); do
            if response=$(curl --max-time 3 --fail --silent http://127.0.0.1:18080/livez) && \
              python -c 'import json, sys; payload = json.loads(sys.argv[1]); assert payload["status"] == "ok"' "$response"; then
              healthy=true
              break
            fi
            sleep 1
          done
          test "$healthy" = true
          unauthenticated=$(curl --max-time 3 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/readyz)
          test "$unauthenticated" = 401
          readiness=$(curl --max-time 3 --silent --show-error --output "$readiness_body" --write-out '%{http_code}' \
            --header 'Authorization: Bearer ci-local-smoke-key' http://127.0.0.1:18080/readyz)
          test "$readiness" = 503
          python -c 'import json, sys; payload = json.load(open(sys.argv[1])); assert payload["status"] == "not_ready"' "$readiness_body"
